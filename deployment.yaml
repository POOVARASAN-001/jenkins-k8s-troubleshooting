
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshoot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: troubleshoot-app
  template:
    metadata:
      labels:
        app: troubleshoot-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
